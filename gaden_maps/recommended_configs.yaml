# Recommended test configurations for each scenario/simulation.
# Fields:
#   source:      [x, y] gas source position (from sim.yaml)
#   robot_start: [x, y] recommended robot starting position
#   start_time:  seconds into the gas simulation to begin playback
#   notes:       any relevant context

10x6_central_obstacle:
  sim1:
    source: [1.45, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Central obstacle blocking direct path to source."
  sim2:
    source: [2.5, 5.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: ""

10x6_empty_room:
  sim1:
    source: [1.0, 4.95]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Open room, no obstacles."

10x6_maze:
  sim1:
    source: [0.5, 2.9]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Maze layout."

10x6_snake:
  sim1:
    source: [0.55, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Snake-shaped corridor."

10x6_u_east:
  sim1:
    source: [9.5, 3.0]
    robot_start: [1.5, 3.0]
    start_time: 100
    notes: "East-source confound test. Source in RIGHT dead-end, robot starts LEFT. Symmetric to 10x6_u_left. Gas re-baked 2026-06-22."

10x6_u_left:
  sim1:
    source: [1.45, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Source in left dead-end of U-shape. Robot starts opposite end."

10x6_u_right:
  sim1:
    source: [1.45, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Source in left dead-end, U opens to the right. Robot starts opposite end."

4_rooms_east:
  sim1:
    source: [11.0, 3.0]
    robot_start: [2.5, 3.0]
    start_time: 100
    notes: "East-source confound test of 4_rooms. Source in bottom-RIGHT room, robot starts bottom-LEFT. Gas re-baked 2026-06-22."

4_rooms:
  sim1:
    source: [2.5, 3.0]
    robot_start: [10.0, 1.0]
    start_time: 100
    notes: "Source in first room. Robot starts far room."
  sim2:
    source: [9.0, 6.0]
    robot_start: [10.0, 1.0]  # TODO: fill in
    start_time: 100
    notes: ""

curved_labrinth_east_left:
  sim1:
    source: [9.5, 3.0]
    robot_start: [1.0, 3.0]
    start_time: 100
    notes: "East-source confound test of curved_labrinth_left. Source RIGHT, robot starts LEFT. Gas re-baked 2026-06-22."

curved_labrinth_east_right:
  sim1:
    source: [9.5, 3.0]
    robot_start: [1.0, 3.0]
    start_time: 100
    notes: "East-source confound test of curved_labrinth_right. Source RIGHT, robot starts LEFT. Gas re-baked 2026-06-22."

curved_labrinth_left:
  sim1:
    source: [0.5, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Curved corridor, source at left end. Robot starts right end."

curved_labrinth_right:
  sim1:
    source: [0.5, 3.0]
    robot_start: [9.0, 3.0]
    start_time: 100
    notes: "Curved corridor, source at left end, mirrored layout. Robot starts right end."

many_rooms:
  sim1:
    source: [2.8, 4.2]
    robot_start: [15.0, 8.0]
    start_time: 250
    notes: "Multiple rooms. Scoring source MATCHED to the GADEN gas source (sim.yaml 2.8,4.2) so success = reaching where the gas is actually emitted."
  sim2:
    source: [2.0, 8.0]
    robot_start: [15.0, 8.0]
    start_time: 250
    notes: ""

ultimate:
  sim1:
    source: [1.45, 3.0]
    robot_start: [18.0,10.0]
    start_time: 350
    notes: "Complex layout combining multiple room types."

10x6_u_right_east:
  sim1:
    source: [9.0, 3.0]
    robot_start: [1.5, 3.0]
    start_time: 100
    notes: "East-source confound test of 10x6_u_right. Source RIGHT, robot starts LEFT. Gas re-bake required."

many_rooms_east:
  sim1:
    source: [15.0, 8.0]
    robot_start: [2.8, 4.2]
    start_time: 250
    notes: "East-source confound test of many_rooms. Source in east rooms, robot starts west. Gas re-bake required."

ultimate_east:
  sim1:
    source: [18.0, 10.0]
    robot_start: [1.5, 3.0]
    start_time: 350
    notes: "East-source confound test of ultimate. Source in east wing, robot starts west wing. Gas re-bake required."

